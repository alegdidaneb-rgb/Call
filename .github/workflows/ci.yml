name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    # The seed step needs a real database. Since the Postgres port there is no
    # local-file fallback — deliberately, because a silent default once produced a
    # working server full of empty tables instead of an error — so a job that ran
    # the seed without one could only fail.
    #
    # Pointing it at an actual server is worth more than making the step pass: it
    # is the only place the shipped DDL is verified automatically. Everywhere else
    # it has been checked by hand against a live database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cold_dialer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cold_dialer
      # The pool defaults to `require`, so that a typo in a production environment
      # cannot quietly downgrade the connection to plaintext. This service has no
      # TLS at all, so the job opts out explicitly rather than by accident.
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Seed database
        working-directory: backend
        run: npm run seed

      # Seeding proves the schema can be created from nothing and filled. This
      # proves it can also be applied again over a database that already has every
      # object — the normal case on a cold start, and the one a duplicate-object
      # error would surface in.
      #
      # Not a second `npm run seed`: profiles.email is unique and the seeded
      # username is fixed, so re-seeding collides on it. The schema is what has to
      # tolerate repetition, not the fixtures.
      - name: Verify the schema is idempotent
        working-directory: backend
        run: npm run check:schema

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.frontend -t cold-dialer-frontend .
          docker build -f docker/Dockerfile.backend -t cold-dialer-backend .

      - name: Test Docker Compose
        # docker-compose.yml fails fast on a missing secret rather than booting
        # with a published default, so these have to be supplied here. They are
        # throwaway values for a container that is torn down at the end of the job.
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          JWT_SECRET: ci-only-not-a-secret-0000000000000000000000
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml up -d --build
          docker compose -f docker/docker-compose.yml ps

          # `ps` alone proves nothing: it lists exited containers too. Wait for the
          # API to answer /api/health/ready, which awaits `ensureSchema()` and
          # returns 503 if the schema could not be applied. That is the first place
          # anywhere the HTTP path and the boot sequence are exercised together.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/ready; then
              echo; echo "backend reported ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "backend never became ready" >&2
              docker compose -f docker/docker-compose.yml logs backend >&2
              exit 1
            fi
            sleep 1
          done

          docker compose -f docker/docker-compose.yml down -v
