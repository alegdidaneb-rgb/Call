services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=coldialer
      - POSTGRES_DB=coldialer
      # A development default is acceptable here because this compose file binds no
      # port to the host: the database is reachable only from inside this network.
      # The production compose file requires POSTGRES_PASSWORD explicitly.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coldialer-dev-only}
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldialer -d coldialer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Anonymous volume so the host bind mount above does not shadow the
      # node_modules installed inside the image. Without this, `npm run dev`
      # fails with "tsx: not found".
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-cold-dialer-INSECURE-LOCAL-DEV-ONLY-do-not-ship}
      - DATABASE_URL=postgres://coldialer:${POSTGRES_PASSWORD:-coldialer-dev-only}@db:5432/coldialer
      - PGSSLMODE=disable
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Same-origin relative path; nginx/vite proxying keeps browser code from
      # having to know the backend host.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
    command: npm run dev

volumes:
  db-data-dev:
